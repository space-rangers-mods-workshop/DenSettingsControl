mod: DenSettingsControl

# public — keys match ModuleInfo.txt; rendered into the card README.md (generate_card.py)
info:
  Name: DenSettingsControl
  Author: "denball, ringill"
  Conflict: SettingsControl,TicTacToe
  Dependence: ""
  Priority: 1
  Section: Разное
  SectionEng: Miscellaneous
  Languages: Rus,Eng
  SmallDescription: |-
    Добавляет панель, с помощью которой можно менять настройки партии
    (Мод можно <color=0,150,15>подключать</color>/<color=0,150,15>отключать</color> в течение партии)
  SmallDescriptionEng: >-
    <color=20,250,20>Safe to use</color> Adds a panel for editing settings of game
  FullDescription: |-
    Добавляет панель на экран космоса, с помощью которой можно менять сложность партии и тонкие настройки прямо во время игры.
    В космосе в левом верхнем углу появятся две кнопки: одна для изменения ТН, другая для изменения сложности.
  FullDescriptionEng: |-
    Adds a panel in space, with which you can change game settings and advanced adjustments right while playing.
    You'll find two new buttons in the left upper corner: one for changing advanced adjustments, another - for changing difficulty.
    <color=0,132,15>(can be enabled/disabled during the game)</color>

